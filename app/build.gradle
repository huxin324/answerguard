plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.family.answerlock'
    compileSdk 34

    defaultConfig {
        applicationId "com.family.answerlock"
        minSdk 24
        targetSdk 33
        // 电视版独立版本线：从 100 起算，和手机版（26 = v3.5）区分开
        versionCode 102
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
